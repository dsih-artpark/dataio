name: dataio CI

on:
  push:
    branches: [staging, production]

jobs:
  # Detect which parts of the codebase changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            api:
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'docs/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  deploy_api:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    environment:
      name: ${{ github.ref_name }}_api

    steps:
      - name: Deploy API
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRIVATE_IP }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.JUMP_SERVER_PRIVATE_KEY }}
          proxy_host: ${{ secrets.JUMP_SERVER_IP }}
          proxy_username: ${{ secrets.USER }}
          proxy_key: ${{ secrets.JUMP_SERVER_PRIVATE_KEY }}
          script: |
            export ENV=${{ github.ref_name }}
            export PATH="/home/ubuntu/.local/bin:$PATH"
            d=$(date +%Y%m%d-%H%M%S)
            cd /home/ubuntu/${{ github.ref_name }}
            cp dataio/logs/dataio-api.log logs_backup/dataio/$d.log || true
            rm -rf dataio
            git clone -b ${{ github.ref_name }} git@github.com:dsih-artpark/dataio.git
            cp /home/ubuntu/infra/.dataio-env /home/ubuntu/${{ github.ref_name }}/dataio/.env
            cd dataio
            mkdir logs
            uv sync --group docs --group api
            uv run sphinx-build -b html docs/source docs/build
            sudo supervisorctl restart dataio-app

  deploy_web:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    environment:
      name: ${{ github.ref_name }}_api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          PUBLIC_WEBAUTHN_RP_ID: ${{ secrets.PUBLIC_WEBAUTHN_RP_ID }}
        run: npm run build

      - name: Prepare dist directory on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRIVATE_IP }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.JUMP_SERVER_PRIVATE_KEY }}
          proxy_host: ${{ secrets.JUMP_SERVER_IP }}
          proxy_username: ${{ secrets.USER }}
          proxy_key: ${{ secrets.JUMP_SERVER_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/${{ github.ref_name }}/dataio-web/dist
            rm -rf /home/ubuntu/${{ github.ref_name }}/dataio-web/dist/*

      - name: Deploy dist to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PRIVATE_IP }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.JUMP_SERVER_PRIVATE_KEY }}
          proxy_host: ${{ secrets.JUMP_SERVER_IP }}
          proxy_username: ${{ secrets.USER }}
          proxy_key: ${{ secrets.JUMP_SERVER_PRIVATE_KEY }}
          source: "web/dist/"
          target: "/home/ubuntu/${{ github.ref_name }}/dataio-web/"
          strip_components: 1

      - name: Fix permissions for nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRIVATE_IP }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.JUMP_SERVER_PRIVATE_KEY }}
          proxy_host: ${{ secrets.JUMP_SERVER_IP }}
          proxy_username: ${{ secrets.USER }}
          proxy_key: ${{ secrets.JUMP_SERVER_PRIVATE_KEY }}
          script: |
            chmod -R 755 /home/ubuntu/${{ github.ref_name }}/dataio-web/dist
