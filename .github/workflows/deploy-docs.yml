name: Build and Deploy Docs from staging branch

on:
  push:
    branches:
      - staging
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Create environment
        run: |
          asdf plugin add uv
          asdf install uv latest
          asdf global uv latest
          UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --all-extras --group docs --link-mode=copy

      - name: Build documentation
        run: |
            uv run sphinx-build -b html docs/source docs/build/
          

      - name: Deploy to dataio-docs (staging branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          publish_dir: ./docs/build/html
          external_repository: dsih-artpark/dataio-docs
          publish_branch: ${{ github.ref_name }}
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy docs from dataio@${{ github.sha }} to staging"