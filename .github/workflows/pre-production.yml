name: Pre-Production Checks

on:
  pull_request:
    branches: [production]

env:
  JWT_SECRET_KEY: test-secret-key-for-ci-testing-only-32chars
  JWT_ALGORITHM: HS256
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  DEBUG_EMAIL: "true"
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_RP_NAME: DataIO Test
  WEBAUTHN_ORIGIN: http://localhost:3000

jobs:
  # Full Python test suite with coverage requirements
  python-full-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install all dependencies
        run: |
          uv sync --group test --group api --group dev

      - name: Run full test suite with coverage
        run: |
          uv run pytest tests/ -v \
            --cov=src/dataio \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junitxml=test-results/all-tests.xml

      - name: Enforce coverage threshold
        run: |
          uv run pytest tests/ \
            --cov=src/dataio \
            --cov-fail-under=60
        continue-on-error: false

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: production-coverage
          path: |
            coverage.xml
            htmlcov/
            test-results/

  # Full web test suite
  web-full-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run check

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Run tests with coverage
        working-directory: web
        run: npm run test:coverage

      - name: Build production bundle
        working-directory: web
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}
          PUBLIC_WEBAUTHN_RP_ID: ${{ secrets.PUBLIC_WEBAUTHN_RP_ID || 'localhost' }}
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-production-coverage
          path: web/coverage/

  # Security checks
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --group api

      - name: Check for known vulnerabilities
        run: |
          uv pip list --format=freeze > requirements.txt
          # Add bandit or safety scan here if desired
          echo "Security scan placeholder - add tools as needed"

  # Final gate check
  production-ready:
    runs-on: ubuntu-latest
    needs: [python-full-tests, web-full-tests, security-scan]

    steps:
      - name: All checks passed
        run: |
          echo "All pre-production checks passed!"
          echo "Python tests: ${{ needs.python-full-tests.result }}"
          echo "Web tests: ${{ needs.web-full-tests.result }}"
          echo "Security scan: ${{ needs.security-scan.result }}"

      - name: Gate check
        if: |
          needs.python-full-tests.result != 'success' ||
          needs.web-full-tests.result != 'success' ||
          needs.security-scan.result != 'success'
        run: |
          echo "One or more checks failed - blocking production deployment"
          exit 1
