name: Tests

on:
  pull_request:
    branches: [staging, main, production]
  push:
    branches: [staging]

env:
  # Test environment variables
  JWT_SECRET_KEY: test-secret-key-for-ci-testing-only-32chars
  JWT_ALGORITHM: HS256
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  DEBUG_EMAIL: "true"
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_RP_NAME: DataIO Test
  WEBAUTHN_ORIGIN: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000,http://localhost:4321

jobs:
  # Detect which parts of the codebase changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
            web:
              - 'web/**'

  # Python unit and smoke tests
  python-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --group test --group api

      - name: Run unit tests
        run: |
          uv run pytest tests/unit -v --tb=short -m "unit" --junitxml=test-results/unit.xml

      - name: Run smoke tests
        run: |
          uv run pytest tests/smoke -v --tb=short -m "smoke" --junitxml=test-results/smoke.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: test-results/

  # Python tests with coverage (runs on PRs to main/production)
  python-coverage:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.python == 'true' &&
      (github.base_ref == 'main' || github.base_ref == 'production')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --group test --group api

      - name: Run tests with coverage
        run: |
          uv run pytest tests/unit tests/smoke -v --cov=src/dataio --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/

      - name: Check coverage threshold
        run: |
          uv run pytest tests/unit tests/smoke --cov=src/dataio --cov-fail-under=50

  # Web frontend tests
  web-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run type checking
        working-directory: web
        run: npm run check

      - name: Run linting
        working-directory: web
        run: npm run lint || true  # Don't fail on lint errors for now

      - name: Run tests
        working-directory: web
        run: npm run test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: web/coverage/

  # Web tests with coverage (runs on PRs to main/production)
  web-coverage:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.web == 'true' &&
      (github.base_ref == 'main' || github.base_ref == 'production')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tests with coverage
        working-directory: web
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage/

  # Build validation
  build-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        env:
          PUBLIC_API_URL: http://localhost:8000/api/v1
          PUBLIC_WEBAUTHN_RP_ID: localhost
        run: npm run build

  # All tests must pass before deployment
  tests-complete:
    runs-on: ubuntu-latest
    needs: [python-tests, web-tests, build-check]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.python-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.web-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.build-check.result }}" == "failure" ]]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All required tests passed"
