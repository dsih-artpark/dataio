[project]
name = "dataio"
version = "0.2.0"
description = "Postgres and FASTAPI based Dataset Management System (DMS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.38.29",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.115.12",
    "ipykernel>=6.29.5",
    "pandas>=2.2.3",
    "psycopg2>=2.9.10",
    "py-bcrypt>=0.4",
    "pyopenssl>=25.0.0",
    "python-multipart>=0.0.20",
    "requests>=2.32.4",
    "sqlalchemy>=2.0.41",
]
